<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>Мой Авто — Новый пароль</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(800px 450px at 50% 0,rgba(215,177,109,.16),transparent 65%),#07090d;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:22px}.box{width:min(440px,100%);padding:30px 24px;border-radius:30px;background:linear-gradient(145deg,rgba(21,26,35,.98),rgba(11,14,20,.98));border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 100px rgba(0,0,0,.55)}.mark{font-size:11px;font-weight:850;letter-spacing:.2em;color:#f0cc8b;text-transform:uppercase}.title{font-size:36px;line-height:1;margin:9px 0 8px;letter-spacing:-.055em}.sub{color:#8e98a8;line-height:1.45;margin-bottom:22px}.note{color:#aeb6c3;line-height:1.45}input,button{width:100%;font:inherit;border-radius:14px;padding:13px;margin:6px 0}input{background:rgba(255,255,255,.045);color:#fff;border:1px solid rgba(255,255,255,.1);min-height:48px}button{border:1px solid rgba(214,173,104,.24);background:linear-gradient(180deg,#dcb678,#b99152);color:#17120b;font-weight:750;min-height:48px}button:disabled{opacity:.55}.secondary{background:rgba(255,255,255,.055);color:#f5f7fa;border-color:rgba(255,255,255,.1)}.msg{display:none;margin:10px 0;padding:11px 12px;border-radius:12px;background:rgba(201,111,112,.12);border:1px solid rgba(201,111,112,.22);color:#efaaaa;font-size:13px}.ok{background:rgba(120,185,151,.12);border-color:rgba(120,185,151,.24);color:#9bd2b5}section,form{display:none}.small{font-size:12px;color:#747f90;margin-top:10px}</style></head><body><main class="box"><div class="mark">MY AUTO · 3.5</div><div class="title">Новый пароль</div><div class="sub" id="sub">Проверяем ссылку восстановления…</div><div id="msg" class="msg"></div><section id="verify"><p class="note">Ссылка получена. Нажми кнопку один раз, чтобы подтвердить восстановление.</p><button id="verifyBtn" onclick="confirmRecovery()">Продолжить восстановление</button><div class="small">До нажатия ссылка не используется.</div></section><form id="password" onsubmit="return savePassword(event)"><input id="p1" type="password" minlength="6" autocomplete="new-password" placeholder="Новый пароль" required><input id="p2" type="password" minlength="6" autocomplete="new-password" placeholder="Повторите новый пароль" required><button id="save">Сохранить новый пароль</button></form><button class="secondary" onclick="location.href='./'">Назад ко входу</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U='https://rimssvnrcpnemeiwptxu.supabase.co',K='sb_publishable_RjG_mMHnoSt7TpQEyUpaQw_MlK6kNL_';
const supa=window.supabase.createClient(U,K,{auth:{flowType:'implicit',autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);const msg=$('msg'),sub=$('sub'),verify=$('verify'),password=$('password');
let tokenHash=null,recoverySession=null;
function showMsg(t,ok=false){msg.textContent=t;msg.className='msg'+(ok?' ok':'');msg.style.display='block'}
function clearUrl(){history.replaceState({},document.title,location.pathname)}
function parse(){const q=new URLSearchParams(location.search||'');const h=new URLSearchParams((location.hash||'').replace(/^#/,''));tokenHash=q.get('token_hash')||h.get('token_hash');const type=q.get('type')||h.get('type');const at=h.get('access_token'),rt=h.get('refresh_token');return {type,at,rt}}
async function init(){const {type,at,rt}=parse();if(tokenHash&&type==='recovery'){sub.textContent='Ссылка восстановления получена. Нажми кнопку ниже.';verify.style.display='block';return}if(at&&rt){const r=await supa.auth.setSession({access_token:at,refresh_token:rt});if(!r.error&&r.data?.session){recoverySession=r.data.session;password.style.display='block';sub.textContent='Ссылка подтверждена. Придумай новый пароль.';clearUrl();return}}const s=await supa.auth.getSession();if(s.data?.session){recoverySession=s.data.session;password.style.display='block';sub.textContent='Сессия восстановления найдена. Придумай новый пароль.';return}sub.textContent='Ссылка восстановления не найдена.';showMsg('Запроси новое письмо восстановления.')}
async function confirmRecovery(){const b=$('verifyBtn');b.disabled=true;b.textContent='Проверяем…';try{if(!tokenHash)throw new Error('Ссылка восстановления неполная.');const r=await supa.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});if(r.error)throw r.error;if(!r.data?.session)throw new Error('Сессия восстановления не получена.');recoverySession=r.data.session;verify.style.display='none';password.style.display='block';sub.textContent='Ссылка подтверждена. Придумай новый пароль.';clearUrl()}catch(e){console.error('RECOVERY VERIFY ERROR',e);showMsg(e?.message||'Ссылка недействительна или уже использована. Запроси новое письмо.');b.disabled=false;b.textContent='Продолжить восстановление'}}
async function savePassword(e){e.preventDefault();const a=$('p1').value,b=$('p2').value;if(a.length<6)return showMsg('Новый пароль должен быть не короче 6 символов.');if(a!==b)return showMsg('Пароли не совпадают.');const btn=$('save');btn.disabled=true;btn.textContent='Сохраняем…';try{if(!recoverySession){const r=await supa.auth.getSession();recoverySession=r.data?.session||null}if(!recoverySession)throw new Error('Сессия восстановления не установлена.');const r=await supa.auth.updateUser({password:a});if(r.error)throw r.error;password.style.display='none';showMsg('Пароль сохранён. Теперь войди с новым паролем.',true);sub.textContent='Готово.';await supa.auth.signOut({scope:'local'}).catch(()=>{});setTimeout(()=>location.href='./',800)}catch(e){showMsg(e?.message||'Не удалось сохранить пароль.')}finally{btn.disabled=false;btn.textContent='Сохранить новый пароль'}return false}
init();
</script></body></html>
