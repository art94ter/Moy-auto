name: Enable final premium CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[premium-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject premium stylesheet, car swipe and work history
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<script src="work-history-modal(?:-v2)?\.js[^>]*></script>', '', s)
          link='<link rel="stylesheet" href="premium-final.css?v=1">'
          swipe='<script src="swipe-v22.js?v=restore2" defer></script>'
          works='<script src="work-history-modal-v2.js?v=2" defer></script>'
          if link not in s:
              s=s.replace('</head>', link+'</head>', 1)
          if swipe not in s:
              s=s.replace('</body>', swipe+'</body>', 1)
          if works not in s:
              s=s.replace('</body>', works+'</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add full work history [premium-injected]"
          git push
