name: Fix login after password recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix login after password recovery') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="""async function updatePassword(){const p1=$(\"authNewPassword\").value;const p2=$(\"authNewPassword2\").value;if(p1.length<6)return authMsg('Новый пароль должен быть не короче 6 символов.');if(p1!==p2)return authMsg('Пароли не совпадают.');const {error}=await supa.auth.updateUser({password:p1});if(error)return authMsg(error.message);$(\"authNewPassword\").value='';$(\"authNewPassword2\").value='';showAuth('login');authMsg('Пароль изменён. Теперь войди с новым паролем.');try{await supa.auth.signOut()}catch(e){console.warn('recovery signOut',e)}}"""
          new="""async function updatePassword(){const p1=$(\"authNewPassword\").value;const p2=$(\"authNewPassword2\").value;if(p1.length<6)return authMsg('Новый пароль должен быть не короче 6 символов.');if(p1!==p2)return authMsg('Пароли не совпадают.');const {error}=await supa.auth.updateUser({password:p1});if(error)return authMsg(error.message);$(\"authNewPassword\").value='';$(\"authNewPassword2\").value='';try{await supa.auth.signOut({scope:'local'});}catch(e){console.warn('recovery signOut',e)}showAuth('login');authMsg('Пароль изменён. Теперь войди с новым паролем.');$(\"authEmail\").focus()}"""
          if old not in s: raise SystemExit('updatePassword not found')
          s=s.replace(old,new,1)
          old_login="""async function loginUser(){const {data,error}=await supa.auth.signInWithPassword({email:$(\"authEmail\").value.trim(),password:$(\"authPassword\").value});if(error)return authMsg(error.message);if(data?.user)await startApp(data.user)}"""
          new_login="""async function loginUser(){const email=$(\"authEmail\").value.trim();const password=$(\"authPassword\").value;if(!email||!password)return authMsg('Введи e-mail и пароль.');authMsg('Выполняется вход…');const {data,error}=await supa.auth.signInWithPassword({email,password});if(error){console.error('LOGIN ERROR',error);return authMsg(error.message||'Не удалось войти.')}if(data?.user){$(\"authError\").style.display='none';await startApp(data.user)}}"""
          if old_login not in s: raise SystemExit('loginUser not found')
          s=s.replace(old_login,new_login,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-login.yml
          git add index.html .github/workflows/fix-login.yml
          git commit -m "Fix login after password recovery"
          git push
