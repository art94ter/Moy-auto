name: Fix recovery UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch recovery flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '/* RECOVERY_VISIBILITY_FIX_V1 */'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          old = '''async function handleAuthRedirect(){try{const params=new URLSearchParams(location.search);const hash=location.hash?new URLSearchParams(location.hash.slice(1)):null;const code=params.get('code');const isRecovery=params.get('type')==='recovery'||hash?.get('type')==='recovery'||hash?.has('access_token');'''
          new = '''async function handleAuthRedirect(){try{const params=new URLSearchParams(location.search);const hash=location.hash?new URLSearchParams(location.hash.slice(1)):null;const code=params.get('code');const isRecovery=params.get('type')==='recovery'||hash?.get('type')==='recovery'||hash?.has('access_token');if(isRecovery){recoveryFlow=true;$(\"appShell\").style.display=\"none\";$(\"authScreen\").style.display=\"grid\";}'''
          if old not in s:
              raise SystemExit('handleAuthRedirect pattern not found')
          s = s.replace(old, new, 1)
          old2 = '''supa.auth.onAuthStateChange((event,session)=>{\n  if(event==='SIGNED_OUT'){'''
          new2 = '''/* RECOVERY_VISIBILITY_FIX_V1 */\nsupa.auth.onAuthStateChange((event,session)=>{\n  if(event==='PASSWORD_RECOVERY'||recoveryFlow){$(\"appShell\").style.display=\"none\";$(\"authScreen\").style.display=\"grid\";}\n  if(event==='SIGNED_OUT'){'''
          if old2 not in s:
              raise SystemExit('onAuthStateChange pattern not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix recovery screen visibility'
          git push