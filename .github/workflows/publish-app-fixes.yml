name: Publish app fixes

on:
  push:
    branches: [main]
    paths:
      - 'app-fixes-v1.js'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject fixes into main
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./app-fixes-v1.js?v=1"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable car photos and swipe fixes'
          git push origin main

      - name: Publish to gh-pages
        shell: bash
        run: |
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git checkout main -- app-fixes-v1.js index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./app-fixes-v1.js?v=1"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY
          git add index.html app-fixes-v1.js
          git diff --cached --quiet || git commit -m 'Publish car photo and swipe fixes'
          git push origin gh-pages
