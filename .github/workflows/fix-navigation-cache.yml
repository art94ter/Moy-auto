name: Fix navigation cache

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update navigation script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'app-fixes-v1.js?v=5'
          new = 'app-fixes-v1.js?v=20260818-6'
          if old not in s:
              raise SystemExit('Expected script reference not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Bust cache for navigation fix'
          git push
