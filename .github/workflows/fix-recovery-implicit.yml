name: Fix recovery flow for cross-browser email links
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'recovery implicit applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch password recovery
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);"
          new = "const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{flowType:'implicit',autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});"
          if old not in s:
              raise SystemExit('createClient marker not found')
          s = s.replace(old, new, 1)

          old = "async function handleAuthRedirect(){try{const params=new URLSearchParams(location.search);const code=params.get('code');if(code){const {error}=await supa.auth.exchangeCodeForSession(code);if(error)authMsg('Ссылка восстановления недействительна или уже использована.');else{showAuth('recovery');authMsg('Придумай новый пароль.');}history.replaceState({},document.title,location.pathname);return;}const hash=location.hash?new URLSearchParams(location.hash.slice(1)):null;if(hash?.get('type')==='recovery'){showAuth('recovery');authMsg('Придумай новый пароль.');}}catch(e){console.warn(e)}}"
          new = "async function handleAuthRedirect(){try{const params=new URLSearchParams(location.search);const hash=location.hash?new URLSearchParams(location.hash.slice(1)):null;const code=params.get('code');const isRecovery=params.get('type')==='recovery'||hash?.get('type')==='recovery'||hash?.has('access_token');if(code){const {error}=await supa.auth.exchangeCodeForSession(code);if(error){authMsg('Ссылка восстановления открыта в другом браузере. Запроси новое письмо и открой ссылку в том же браузере.');return;}showAuth('recovery');authMsg('Придумай новый пароль.');history.replaceState({},document.title,location.pathname);return;}if(hash?.get('access_token')&&hash?.get('refresh_token')){const {error}=await supa.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(error){authMsg(error.message);return;}showAuth('recovery');authMsg('Придумай новый пароль.');return;}if(isRecovery){showAuth('recovery');authMsg('Придумай новый пароль.');}}catch(e){console.warn(e);authMsg('Не удалось открыть восстановление. Запроси новое письмо.')}}"
          if old not in s:
              raise SystemExit('handleAuthRedirect marker not found')
          s = s.replace(old, new, 1)

          old = 'supa.auth.getSession().then(({data})=>{if(data.session)startApp(data.session.user)});'
          new = "supa.auth.getSession().then(({data})=>{const hash=location.hash?new URLSearchParams(location.hash.slice(1)):null;const recovery=location.search.includes('code=')||location.search.includes('type=recovery')||hash?.get('type')==='recovery'||hash?.has('access_token');if(recovery&&data.session){showAuth('recovery');authMsg('Придумай новый пароль.');}else if(data.session)startApp(data.session.user)});"
          if old not in s:
              raise SystemExit('getSession marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-recovery-implicit.yml
          git add index.html .github/workflows/fix-recovery-implicit.yml
          git commit -m "recovery implicit applied"
          git push
