name: Refresh auth recovery script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'chore: bump auth fix cache')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump recovery script cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='./registration-fix.js?v=7'
          new='./registration-fix.js?v=9'
          if old not in s:
              print('No cache key update needed')
              raise SystemExit(0)
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit cache key update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: bump auth fix cache'
          git push