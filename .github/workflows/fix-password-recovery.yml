name: Fix password recovery flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix password recovery flow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch password recovery
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '<style id="auth3">'
          new_css = '''<style id="auth-recovery-fix">\n.recovery-form{display:none}.recovery-title{font-size:24px;font-weight:800;margin:0 0 8px}.recovery-sub{color:#8e98a8;line-height:1.45;margin-bottom:16px}.recovery-form button{margin-top:8px}.recovery-back{background:transparent!important;color:#aeb6c3!important;border-color:rgba(255,255,255,.1)!important;box-shadow:none!important}\n</style>\n<style id="auth3">'''
          if old_css not in s:
              raise SystemExit('auth3 marker not found')
          s = s.replace(old_css, new_css, 1)

          old_auth = '<div id="authSignup" style="display:none"><input id="authName" placeholder="Ваше имя" autocomplete="name"><input id="authEmail2" type="email" placeholder="E-mail" autocomplete="email"><input id="authPassword2" type="password" placeholder="Пароль (минимум 6 символов)" autocomplete="new-password"><button onclick="signupUser()">Создать аккаунт</button></div>'
          new_auth = old_auth + """<div id="authRecovery" class="recovery-form"><div class="recovery-title">Новый пароль</div><div class="recovery-sub">Ссылка из письма подтверждена. Придумай новый пароль для аккаунта.</div><input id="authNewPassword" type="password" placeholder="Новый пароль (минимум 6 символов)" autocomplete="new-password"><input id="authNewPassword2" type="password" placeholder="Повтори новый пароль" autocomplete="new-password"><button onclick="updatePassword()">Сохранить новый пароль</button><button class="recovery-back" onclick="showAuth('login')">Назад ко входу</button></div>"""
          if old_auth not in s:
              raise SystemExit('auth form marker not found')
          s = s.replace(old_auth, new_auth, 1)

          old_show = "function showAuth(mode){$(\"authLogin\").style.display=mode==='login'?'block':'none';$(\"authSignup\").style.display=mode==='signup'?'block':'none';$(\"loginTab\").classList.toggle('active',mode==='login');$(\"signupTab\").classList.toggle('active',mode==='signup');$(\"authError\").style.display='none'}"
          new_show = "function showAuth(mode){$(\"authLogin\").style.display=mode==='login'?'block':'none';$(\"authSignup\").style.display=mode==='signup'?'block':'none';$(\"authRecovery\").style.display=mode==='recovery'?'block':'none';$(\"loginTab\").style.display=mode==='recovery'?'none':'block';$(\"signupTab\").style.display=mode==='recovery'?'none':'block';$(\"loginTab\").classList.toggle('active',mode==='login');$(\"signupTab\").classList.toggle('active',mode==='signup');$(\"authError\").style.display='none'}"
          if old_show not in s:
              raise SystemExit('showAuth marker not found')
          s = s.replace(old_show, new_show, 1)

          old_reset = "async function resetPassword(){const email=$(\"authEmail\").value.trim();if(!email)return authMsg('Сначала введи e-mail.');const {error}=await supa.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)return authMsg(error.message);authMsg('Письмо для восстановления отправлено.')}"
          new_reset = "async function resetPassword(){const email=$(\"authEmail\").value.trim();if(!email)return authMsg('Сначала введи e-mail.');const {error}=await supa.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)return authMsg(error.message);authMsg('Письмо для восстановления отправлено.')}\nasync function updatePassword(){const p1=$(\"authNewPassword\").value;const p2=$(\"authNewPassword2\").value;if(p1.length<6)return authMsg('Новый пароль должен быть не короче 6 символов.');if(p1!==p2)return authMsg('Пароли не совпадают.');const {error}=await supa.auth.updateUser({password:p1});if(error)return authMsg(error.message);$(\"authNewPassword\").value='';$(\"authNewPassword2\").value='';showAuth('login');authMsg('Пароль изменён. Теперь войди с новым паролем.');try{await supa.auth.signOut()}catch(e){console.warn('recovery signOut',e)}}"
          if old_reset not in s:
              raise SystemExit('resetPassword marker not found')
          s = s.replace(old_reset, new_reset, 1)

          old_redirect = "async function handleAuthRedirect(){try{const code=new URLSearchParams(location.search).get('code');if(code){const {data,error}=await supa.auth.exchangeCodeForSession(code);if(error)authMsg('Ссылка подтверждения недействительна или уже использована.');else if(data.session)await startApp(data.session.user);history.replaceState({},document.title,location.pathname);}}catch(e){console.warn(e)}}"
          new_redirect = "async function handleAuthRedirect(){try{const params=new URLSearchParams(location.search);const code=params.get('code');if(code){const {error}=await supa.auth.exchangeCodeForSession(code);if(error)authMsg('Ссылка восстановления недействительна или уже использована.');else{showAuth('recovery');authMsg('Придумай новый пароль.');}history.replaceState({},document.title,location.pathname);return;}const hash=location.hash?new URLSearchParams(location.hash.slice(1)):null;if(hash?.get('type')==='recovery'){showAuth('recovery');authMsg('Придумай новый пароль.');}}catch(e){console.warn(e)}}"
          if old_redirect not in s:
              raise SystemExit('handleAuthRedirect marker not found')
          s = s.replace(old_redirect, new_redirect, 1)

          old_listener = "supa.auth.onAuthStateChange((event,session)=>{\n  if(event==='SIGNED_OUT'){authGeneration++;resetGarageState();currentUser=null;return}\n  if(session?.user){void startApp(session.user)}\n});"
          new_listener = "supa.auth.onAuthStateChange((event,session)=>{\n  if(event==='SIGNED_OUT'){authGeneration++;resetGarageState();currentUser=null;return}\n  if(event==='PASSWORD_RECOVERY'){showAuth('recovery');authMsg('Придумай новый пароль.');return}\n  if(session?.user){void startApp(session.user)}\n});"
          if old_listener not in s:
              raise SystemExit('auth listener marker not found')
          s = s.replace(old_listener, new_listener, 1)

          p.write_text(s, encoding='utf-8')
          print('patched', len(s))
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-password-recovery.yml
          git add index.html .github/workflows/fix-password-recovery.yml
          git commit -m "Fix password recovery flow"
          git push
