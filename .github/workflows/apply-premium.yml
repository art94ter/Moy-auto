name: Apply premium dashboard UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  premium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium dashboard v5
        run: python3 scripts/apply-premium.py
      - name: Commit generated UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply premium dashboard UI [skip ci]"
          git push
