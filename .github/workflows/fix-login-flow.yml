name: Fix login flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='async function startApp(user){\n  if(!user?.id)return;\n  if(currentUser?.id===user.id && garageReady)return;\n  const generation=++authGeneration;\n  clearTimeout(cloudTimer);cloudTimer=null;\n  currentUser=user;\n  resetGarageState();\n  currentUser=user;\n  const loaded=await cloudLoad(user,generation);\n  if(generation!==authGeneration||!currentUser||currentUser.id!==user.id||!loaded.ok)return;\n  render();\n}'
          new='async function startApp(user){\n  if(!user?.id)return;\n  if(currentUser?.id===user.id && garageReady)return;\n  const generation=++authGeneration;\n  clearTimeout(cloudTimer);cloudTimer=null;\n  currentUser=user;\n  $("authScreen").style.display="none";\n  $("appShell").classList.remove("authHidden");\n  resetGarageState();\n  currentUser=user;\n  try{await cloudLoad(user,generation)}catch(e){console.error("CLOUD LOAD EXCEPTION",e)}\n  if(generation!==authGeneration||!currentUser||currentUser.id!==user.id)return;\n  garageReady=true;\n  render();\n}'
          if old not in s: raise SystemExit('startApp marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-login-flow.yml
          git add index.html .github/workflows/fix-login-flow.yml
          git commit -m 'Fix login flow'
          git push
