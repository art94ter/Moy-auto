name: Apply recovery v7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply recovery v7') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app auth bootstrap
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("flowType:'implicit'", "flowType:'pkce'")
          s = s.replace('if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");', 'if("serviceWorker"in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}')
          s = s.replace('<script src="./registration-fix.js"></script>', '<script src="./registration-fix.js?v=7"></script>')
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply recovery v7"
          git push
