name: Fix published app

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix published script loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          # Remove duplicate/legacy dashboard interaction layers and old swipe/car loaders.
          for name in ['swipe-v22.js','car-image-loader.js','registration-fix.js','interaction-fix.js']:
              s = re.sub(r'<script[^>]+src=["\'](?:\./)?' + re.escape(name) + r'(?:\?[^"\']*)?[^>]*></script>', '', s, flags=re.I)
          # Keep one current interaction/design layer with an explicit cache-busting version.
          marker = '<script src="registration-fix.js?v=final20260817"></script><script src="interaction-fix.js?v=final20260817"></script>'
          if marker not in s:
              s = s.replace('</body>', marker + '</body>')
          p.write_text(s)
          PY

      - name: Publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Publish final dashboard design and interactions'
          git push origin HEAD:gh-pages
