name: Remove automatic car catalog photos
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove loader reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s2=s.replace('<script src="car-image-loader.js"></script>','')
          if s2 != s:
              p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove catalog photo loader reference [skip ci]"
          git push
