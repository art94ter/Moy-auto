name: Disable automatic car catalog photos
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify catalog loader is disabled
        run: |
          if grep -q 'car-image-loader.js' index.html; then
            echo 'car-image-loader.js is still referenced in index.html'
            exit 1
          fi
          echo 'Catalog photo loader disabled.'
