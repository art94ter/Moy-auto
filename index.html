<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080a0d">
<title>Мой Авто 0.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#080a0d;color:#f4f4f1;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{min-height:100dvh;display:flex;justify-content:center}
button,input,select,textarea{font:inherit}
#app{width:min(100%,650px);min-height:100dvh;padding:17px 16px 34px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{display:flex;gap:10px;align-items:center}
.mark{width:39px;height:39px;border:1px solid #3a3e42;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#20242a,#0f1114);font-size:19px}
.brand b{font-size:19px}.brand span{display:block;color:#777e86;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;margin-top:2px}
.icon{width:42px;height:42px;border-radius:13px;background:#15181c;border:1px solid #292d31;color:#fff;font-size:22px}
.hero{background:linear-gradient(145deg,#171b20,#0f1215);border:1px solid #2a2f34;border-radius:26px;padding:21px;box-shadow:0 20px 50px #0005;margin-bottom:12px}
.eyebrow{color:#8e959d;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
.carname{font-size:29px;font-weight:850;letter-spacing:-1px;margin:6px 0 2px}.muted{color:#858c94;font-size:13px}
.mileage{margin-top:19px;display:flex;align-items:end;justify-content:space-between}.mileage strong{font-size:35px;letter-spacing:-1.5px}.mileage span{color:#8c939b;font-size:12px;padding-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#111419;border:1px solid #252a2f;border-radius:18px;padding:15px}.stat small{color:#747c84;font-size:11px}.stat b{display:block;font-size:19px;margin-top:7px}
.green{color:#70d59c}.gold{color:#d8b56a}.red{color:#ed7777}
.tabs{display:flex;gap:7px;background:#111419;border:1px solid #252a2f;border-radius:15px;padding:4px;margin-bottom:14px}
.tab{flex:1;border:0;background:transparent;color:#7f878f;padding:10px 5px;border-radius:11px;font-size:13px;font-weight:800}
.tab.active{background:#e9e5dc;color:#101214}
.section{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 9px}.section h2{font-size:18px;margin:0}
.link{border:0;background:none;color:#d8b56a;font-weight:800;font-size:13px}
.service,.history{display:flex;align-items:center;gap:12px;background:#111419;border:1px solid #252a2f;border-radius:17px;padding:13px;margin-bottom:8px}
.svcicon{width:42px;height:42px;border-radius:12px;background:#1b2025;display:grid;place-items:center;font-size:18px}.svc{flex:1}
.svc b{font-size:14px}.svc small{display:block;color:#747c84;margin-top:4px;font-size:11px;line-height:1.35}
.status{font-size:10px;font-weight:900;padding:7px 8px;border-radius:9px;background:#17241d;color:#70d59c}
.warn{background:#292217;color:#e1bc6b}
.primary{width:100%;border:0;border-radius:16px;background:#e9e5dc;color:#101214;padding:15px;font-size:16px;font-weight:900;margin-top:9px}
.empty{padding:28px 10px;text-align:center;color:#7f878f}.empty strong{display:block;color:#dfe1df;font-size:18px;margin-bottom:7px}
.history{align-items:flex-start}.date{width:62px;color:#d8b56a;font-weight:900;font-size:12px}.hmain{flex:1;font-size:14px}.km{color:#8d959d;font-size:11px;margin-top:3px;line-height:1.35}.cost{color:#d7d9d5;font-size:12px;font-weight:800}
.notice{background:#191a16;border:1px solid #3c3829;border-radius:16px;padding:12px;margin-bottom:12px;color:#d8c58e;font-size:12px;line-height:1.4}
.importbox{border:1px dashed #454b52;border-radius:16px;padding:16px;text-align:center;color:#8b939b;margin-top:10px}.importbox b{display:block;color:#ddd;margin-bottom:4px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:10px}.modal.show{display:flex}
.sheet{width:min(100%,620px);max-height:92dvh;overflow:auto;background:#15191e;border:1px solid #30353a;border-radius:25px 25px 15px 15px;padding:21px;box-shadow:0 -20px 60px #0009}
.sheet h2{margin:0 0 15px;font-size:23px}.sheet p{color:#858d95;font-size:12px;line-height:1.4}
label{display:block;color:#8d959d;font-size:11px;margin:11px 0 6px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #30353b;background:#0c0f12;color:#fff;font-size:15px;outline:none}
textarea{min-height:75px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions{display:flex;gap:9px;margin-top:17px}.actions button{flex:1;padding:14px;border-radius:13px;font-weight:900;border:0}
.cancel{background:#24292e;color:#fff}.save{background:#e9e5dc;color:#101214}
</style>
</head>
<body>
<div id="app">
<div class="top"><div class="brand"><div class="mark">◉</div><div><b>Мой Авто</b><span>Personal Garage</span></div></div><button class="icon" id="addCar">＋</button></div>
<div id="content"></div>
</div>

<div class="modal" id="carModal"><div class="sheet"><h2>Добавить автомобиль</h2>
<label>Марка и модель</label><input id="carMake" placeholder="BMW 530d">
<div class="row"><div><label>Год</label><input id="carYear" type="number" placeholder="2021"></div><div><label>Текущий пробег, км</label><input id="carKm" type="number" placeholder="85000"></div></div>
<label>Двигатель</label><input id="carEngine" placeholder="3.0 Diesel">
<div class="actions"><button class="cancel" onclick="closeModal('carModal')">Отмена</button><button class="save" onclick="saveCar()">Сохранить</button></div></div></div>

<div class="modal" id="recordModal"><div class="sheet"><h2>Добавить запись в историю</h2>
<p>Можно заносить данные, которые были известны <b>до установки приложения</b>.</p>
<label>Дата</label><input id="rDate" type="date">
<label>Пробег на момент работы, км</label><input id="rKm" type="number" placeholder="82000">
<label>Тип записи</label><select id="rType">
<option>Замена масла</option><option>Масляный фильтр</option><option>Воздушный фильтр</option><option>Салонный фильтр</option><option>Свечи</option><option>Тормозные колодки</option><option>Тормозные диски</option><option>Шины</option><option>Ремень ГРМ / цепь</option><option>Другое</option>
</select>
<label>Что сделали</label><input id="rText" placeholder="Например: масло 5W-30 + фильтр">
<div class="row"><div><label>Стоимость</label><input id="rCost" type="number" placeholder="120"></div><div><label>Следующий интервал, км</label><input id="rNext" type="number" placeholder="10000"></div></div>
<label>Комментарий</label><textarea id="rNote" placeholder="Сервис, детали, заметки..."></textarea>
<div class="actions"><button class="cancel" onclick="closeModal('recordModal')">Отмена</button><button class="save" onclick="saveRecord()">Сохранить</button></div></div></div>

<script>
const content=document.querySelector('#content');
let cars=JSON.parse(localStorage.getItem('moy_avto_cars_v2')||'[]');
let activeId=localStorage.getItem('moy_avto_active')||'';
let tab='service';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function persist(){localStorage.setItem('moy_avto_cars_v2',JSON.stringify(cars))}
function car(){return cars.find(c=>c.id===activeId)||cars[0]}
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function fmtKm(n){return Number(n||0).toLocaleString('ru-RU')}

function saveCar(){
 const make=document.querySelector('#carMake').value.trim(),km=Number(document.querySelector('#carKm').value);
 if(!make||!km){alert('Укажите марку/модель и текущий пробег.');return}
 const c={id:Date.now().toString(),make,year:document.querySelector('#carYear').value,km,engine:document.querySelector('#carEngine').value.trim(),records:[]};
 cars.unshift(c);activeId=c.id;localStorage.setItem('moy_avto_active',activeId);persist();closeModal('carModal');render();
}
function saveRecord(){
 const c=car();if(!c)return;
 const km=Number(document.querySelector('#rKm').value),text=document.querySelector('#rText').value.trim();
 if(!km||!text){alert('Укажите пробег и описание работы.');return}
 c.records=c.records||[];
 c.records.push({id:Date.now(),date:document.querySelector('#rDate').value||new Date().toISOString().slice(0,10),km,type:document.querySelector('#rType').value,text,cost:Number(document.querySelector('#rCost').value)||0,next:Number(document.querySelector('#rNext').value)||0,note:document.querySelector('#rNote').value.trim()});
 c.records.sort((a,b)=>String(b.date).localeCompare(String(a.date)));persist();closeModal('recordModal');render();
}
function serviceRows(c){
 const rec=c.records||[],latest={};rec.forEach(r=>{if(!latest[r.type]||r.km>latest[r.type].km)latest[r.type]=r});
 const current=Number(c.km||0);
 const base=[['🛢️','Замена масла','Замена масла'],['🌬️','Воздушный фильтр','Воздушный фильтр'],['❄️','Салонный фильтр','Салонный фильтр'],['🛑','Тормозные колодки','Тормозные колодки'],['🔥','Свечи','Свечи']];
 return base.map(x=>{
  const r=latest[x[2]],next=r&&r.next?r.km+r.next:null;let status='НЕТ ДАННЫХ',cl='warn',desc=r?`Последняя запись: ${fmtKm(r.km)} км`:'Добавьте первую запись в историю';
  if(next){let left=next-current;if(left<=0){status='ПРОСРОЧЕНО';desc=`Следующий срок был ${fmtKm(next)} км`}else{status='В НОРМЕ';cl='';desc=`Следующая замена через ${fmtKm(left)} км`}}
  return `<div class="service"><div class="svcicon">${x[0]}</div><div class="svc"><b>${x[1]}</b><small>${desc}</small></div><span class="status ${cl}">${status}</span></div>`;
 }).join('');
}
function historyRows(c){
 const rec=[...(c.records||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 if(!rec.length)return `<div class="empty"><strong>История пока пустая</strong>Добавьте старые работы и пробеги — даже если они были до установки приложения.</div>`;
 return rec.map(r=>`<div class="history"><div class="date">${esc((r.date||'').split('-').reverse().join('.'))}</div><div class="hmain"><b>${esc(r.type)}</b><div class="km">${fmtKm(r.km)} км · ${esc(r.text)}</div>${r.note?`<div class="km">${esc(r.note)}</div>`:''}</div>${r.cost?`<div class="cost">${fmtKm(r.cost)} €</div>`:''}</div>`).join('');
}
function render(){
 if(!cars.length){content.innerHTML=`<div class="hero"><div class="eyebrow">Ваш гараж</div><div class="carname">Создайте профиль автомобиля</div><div class="muted">После этого можно занести всю историю обслуживания, включая данные за годы до установки приложения.</div><button class="primary" onclick="openModal('carModal')">＋ Добавить автомобиль</button></div><div class="empty"><strong>История не потеряется</strong>Старые чеки, пробеги и замены можно занести вручную.</div>`;return}
 const c=car(),rec=c.records||[],last=rec.length?rec[0]:null;
 content.innerHTML=`<div class="hero"><div class="eyebrow">Мой автомобиль</div><div class="carname">${esc(c.make)}</div><div class="muted">${esc(c.year||'')} · ${esc(c.engine||'Двигатель не указан')}</div><div class="mileage"><strong>${fmtKm(c.km)}</strong><span>км текущий пробег</span></div></div>
 <div class="grid"><div class="stat"><small>Записей истории</small><b class="green">${rec.length}</b></div><div class="stat"><small>Последняя работа</small><b class="${last?'gold':'red'}">${last?esc(last.type).replace('Замена ',''):'Нет'}</b></div></div>
 <div class="tabs"><button class="tab ${tab==='service'?'active':''}" onclick="setTab('service')">Обслуживание</button><button class="tab ${tab==='history'?'active':''}" onclick="setTab('history')">История</button></div>
 ${tab==='service'?`<div class="notice">💡 Вносите старые работы с их реальным пробегом. Приложение использует их при расчёте следующих замен.</div><div class="section"><h2>Контроль обслуживания</h2><button class="link" onclick="openModal('recordModal')">＋ Запись</button></div>${serviceRows(c)}`:`<div class="section"><h2>Вся история</h2><button class="link" onclick="openModal('recordModal')">＋ Добавить</button></div>${historyRows(c)}<div class="importbox"><b>Импорт CSV / Excel</b>Подготовим загрузку старого журнала в следующем обновлении.</div>`}
 <button class="primary" onclick="openModal('recordModal')">＋ Добавить запись</button>`;
}
function setTab(t){tab=t;render()}
document.querySelector('#addCar').onclick=()=>openModal('carModal');
render();
</script>
</body>
</html>
