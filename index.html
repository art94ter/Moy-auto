<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0c10"><link rel="manifest" href="manifest.webmanifest"><title>Мой Авто</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0c10;color:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}main{max-width:720px;margin:auto;padding:25px 16px 80px}h1{font-size:40px;margin:5px 0}.muted{color:#929aa6}.card{background:#13171d;border:1px solid #29303a;border-radius:22px;padding:18px;margin:13px 0}input,textarea,button{font:inherit;width:100%;padding:13px;border-radius:13px;margin-top:8px}input,textarea{border:1px solid #343b45;background:#0d1015;color:#fff}textarea{min-height:120px}button{border:0;background:#eeeae2;color:#101216;font-weight:800}.danger{background:#4a2222;color:#fff}.item{border-top:1px solid #29303a;padding:13px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.price{color:#d7b46b}</style></head><body><main><h1>Мой Авто</h1><p class="muted">Версия 1.0 · журнал автомобиля, пробег и обслуживание</p><section class="card"><h2>Автомобиль</h2><input id="car" placeholder="Марка и модель"><div class="row"><input id="km" type="number" placeholder="Текущий пробег, км"><input id="year" type="number" placeholder="Год"></div><button onclick="saveCar()">Сохранить</button></section><section class="card"><h2>Обслуживание</h2><input id="date" type="date"><input id="skm" type="number" placeholder="Пробег при выполнении"><input id="work" placeholder="Что сделали"><input id="cost" type="number" placeholder="Стоимость, €"><button onclick="add()">Добавить запись</button></section><section class="card"><h2>Импорт из «Заметок»</h2><p class="muted">Формат: дата | пробег | работа | стоимость</p><textarea id="notes" placeholder="15.03.2026 | 84500 | Замена масла | 120"></textarea><button onclick="imp()">Импортировать</button></section><section class="card"><h2>История</h2><div id="history"></div></section></main><script>
const K="moy-avto-v1";let d=JSON.parse(localStorage.getItem(K)||'{"car":{},"services":[]}');const $=x=>document.getElementById(x);function save(){localStorage.setItem(K,JSON.stringify(d));render()}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function saveCar(){d.car={name:$("car").value,km:+$("km").value||0,year:$("year").value};save()}function add(){if(!$("work").value.trim())return alert("Укажите работу");d.services.push({date:$("date").value||new Date().toISOString().slice(0,10),km:+$("skm").value||0,work:$("work").value.trim(),cost:+$("cost").value||0});d.services.sort((a,b)=>b.date.localeCompare(a.date));save();$("work").value=$("skm").value=$("cost").value=""}function imp(){let n=0;$("notes").value.split(/\n+/).filter(Boolean).forEach(s=>{let p=s.split("|").map(x=>x.trim());if(p.length>=3){d.services.push({date:p[0],km:+(p[1]||"").replace(/\D/g,"")||0,work:p[2],cost:+(p[3]||"").replace(",","." )||0});n++}});d.services.sort((a,b)=>b.date.localeCompare(a.date));save();$("notes").value="";alert("Импортировано: "+n)}function render(){$("car").value=d.car.name||"";$("km").value=d.car.km||"";$("year").value=d.car.year||"";$("history").innerHTML=d.services.length?d.services.map((x,i)=>'<div class="item"><b>'+esc(x.work)+'</b><br><span class="muted">'+esc(x.date)+' · '+(x.km||0)+' км</span>'+(x.cost?'<br><span class="price">'+x.cost+' €</span>':'')+'<br><button class="danger" onclick="del('+i+')">Удалить</button></div>').join(""):'<span class="muted">История пока пустая.</span>'}function del(i){d.services.splice(i,1);save()}$("date").value=new Date().toISOString().slice(0,10);render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
